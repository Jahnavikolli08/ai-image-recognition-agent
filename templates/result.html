<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Recognition Result</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🤖 AI Image Recognition Result</h1>

        <img src="{{ image_path }}" alt="Uploaded Image">

        <div class="result">
            <h2>🦁 Prediction</h2>
            <p><b>{{ object_name }}</b></p>

            <br>

            <h2>📊 Confidence</h2>

            <div class="progress-bar">
                <div class="progress" style="width: {{ confidence }}%;"></div>
            </div>

            <p><b>{{ confidence }}%</b></p>
        </div>

        <a href="/">🔄 Predict Another Image</a>

    </div>

</body>

</html>
<hr>
